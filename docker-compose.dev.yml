services:
  gor-gemilangcondet-db:
    image: postgres:16-alpine
    container_name: gor-gemilangcondet-dev-db
    ports:
      - "35001:5432"
    restart: "no"
    environment:
      POSTGRES_DB: gor-gemilangcondet-dev
      POSTGRES_USER: gor-gemilangcondet-dev
      POSTGRES_PASSWORD: CLI-825.2025X
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gor-gemilangcondet-dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data: