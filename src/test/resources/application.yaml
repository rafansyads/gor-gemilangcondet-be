server:
  port: 0
  servlet:
    context-path: /api

spring:
  application:
    name: backend-api-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  cache:
    type: jcache
    cache-names: rate-limit-buckets
    jcache:
      provider: com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider

  jackson:
    date-format: dd-MM-yyyy HH:mm:ss
    time-zone: Asia/Jakarta
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: TestSecretKeyForJwtTokensThatMustBeLongEnough1234567890
    expiration: 86400000
  upload:
    dir: build/test-uploads/payment-proofs

bucket4j:
  enabled: true
  filters:
    - cache-name: rate-limit-buckets
      filter-method: servlet
      filter-order: 1
      http-response-body: '{"status": 429, "message": "Terlalu banyak permintaan.", "timestamp": null, "data": null}'
      rate-limits:
        - execute-condition: "request.getRequestURI().startsWith('/api/auth')"
          cache-key: "getRemoteAddr()"
          bandwidths:
            - capacity: 5
              time: 1
              unit: minutes
        - execute-condition: "request.getMethod().matches('POST|PUT|DELETE') && !request.getRequestURI().startsWith('/api/auth')"
          cache-key: "getRemoteAddr()"
          bandwidths:
            - capacity: 20
              time: 1
              unit: minutes
        - execute-condition: "request.getMethod().equals('GET') && !request.getRequestURI().startsWith('/api/auth')"
          cache-key: "getRemoteAddr()"
          bandwidths:
            - capacity: 100
              time: 1
              unit: minutes
