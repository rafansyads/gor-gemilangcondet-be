server:
  port: 0
  servlet:
    context-path: /api

spring:
  application:
    name: backend-api-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  cache:
    type: jcache
    cache-names: rate-limit-buckets
    jcache:
      provider: com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider

  jackson:
    date-format: dd-MM-yyyy HH:mm:ss
    time-zone: Asia/Jakarta

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: TestSecretKeyForJwtTokensThatMustBeLongEnough1234567890
    expiration: 86400000
  upload:
    dir: build/test-uploads/payment-proofs
  rate-limit:
    auth:
      capacity: 10
      window-seconds: 300
    cud:
      capacity: 20
      window-seconds: 60
    read:
      capacity: 125
      window-seconds: 60
